<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stránka nenalezena (404) | Indigo Studio</title>
<meta name="description" content="Tahle adresa na indigostudio.cz není. Vraťte se prosím na úvodní stránku.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#16162d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f6fe" media="(prefers-color-scheme: light)">

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<style>
  :root {
    --indigo: #6366f1; --indigo-2: #818cf8; --indigo-soft: rgba(99,102,241,.14);
    --ease: cubic-bezier(.22,1,.36,1);
    --bg: #0b0b12; --bg-top: rgba(99,102,241,.12); --bg-elev: rgba(255,255,255,.035);
    --border: rgba(255,255,255,.09); --border-hover: rgba(129,140,248,.45);
    --fg: #f4f4f6; --fg-muted: #a1a1ad; --fg-faint: #6b6b78; --glow: rgba(99,102,241,.16);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #ffffff; --bg-top: rgba(99,102,241,.06); --bg-elev: rgba(15,18,40,.025);
      --border: rgba(15,18,40,.10); --border-hover: rgba(99,102,241,.5);
      --fg: #15161d; --fg-muted: #5a5b6a; --fg-faint: #9a9ba8; --glow: rgba(99,102,241,.10);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: linear-gradient(180deg, var(--bg-top), transparent 320px) no-repeat, var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; line-height: 1.6; min-height: 100svh; overflow-x: hidden;
    display: grid; place-items: center;
  }
  .glow { position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(420px circle at var(--mx,50%) var(--my,30%), var(--glow), transparent 70%);
    transition: background .2s linear; }
  a { color: var(--indigo-2); }
  :focus-visible { outline: 2px solid var(--indigo-2); outline-offset: 3px; border-radius: 4px; }

  .wrap { position: relative; z-index: 1; width: 100%; max-width: 480px; text-align: center;
    padding: max(2rem, env(safe-area-inset-top)) max(1.4rem, env(safe-area-inset-right))
             3rem max(1.4rem, env(safe-area-inset-left)); }

  .mark { width: 40px; height: 40px; border-radius: 12px; margin: 0 auto 1.6rem;
    background: linear-gradient(135deg, var(--indigo), var(--indigo-2)); box-shadow: 0 8px 30px -6px var(--indigo); }

  .code { font-size: clamp(3.4rem, 16vw, 5.5rem); font-weight: 700; letter-spacing: -.04em; line-height: 1;
    background: linear-gradient(135deg, var(--indigo-2), var(--indigo));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  h1 { font-size: clamp(1.3rem, 5vw, 1.7rem); font-weight: 650; letter-spacing: -.02em; margin: .8rem 0 .6rem; }
  p { color: var(--fg-muted); max-width: 34ch; margin: 0 auto 2rem; }

  .cta { display: inline-flex; align-items: center; gap: .5rem;
    text-decoration: none; color: var(--fg); font-weight: 550;
    background: var(--indigo-soft); border: 1px solid var(--border-hover); border-radius: 12px; padding: .7rem 1.1rem;
    transition: transform .2s var(--ease), border-color .2s var(--ease); }
  .cta:hover { transform: translateY(-2px); }
  .cta svg { width: 16px; height: 16px; }

  footer { margin-top: 2.4rem; color: var(--fg-faint); font-size: .82rem; }
  footer a { color: var(--fg-muted); text-decoration: none; }
  footer a:hover { color: var(--indigo-2); }

  @media (prefers-reduced-motion: reduce) { *, html { transition: none !important; scroll-behavior: auto; } .glow { display: none; } }
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>

<main class="wrap">
  <span class="mark" aria-hidden="true"></span>
  <p class="code" aria-hidden="true">404</p>
  <h1>Stránka nenalezena</h1>
  <p>Tahle adresa u nás není — nejspíš se přesunula, nebo nikdy neexistovala.</p>
  <a class="cta" href="/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    Zpět na úvod
  </a>

  <footer>
    <a href="/">Indigo Studio s.r.o.</a>
  </footer>
</main>

<script>
  if (!window.matchMedia || !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    var glow = document.querySelector(".glow");
    window.addEventListener("pointermove", function (e) {
      glow.style.setProperty("--mx", e.clientX + "px");
      glow.style.setProperty("--my", e.clientY + "px");
    }, { passive: true });
  }
</script>
</body>
</html>
