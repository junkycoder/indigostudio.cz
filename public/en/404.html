<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found (404) | Indigo Studio</title>
<meta name="description" content="This address does not exist on indigostudio.cz. Please return to the home page.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0e0c16" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<style>
  :root {
    --indigo: #b899ff; --indigo-2: #b899ff; --on-indigo: #0e0c16; --indigo-soft: rgba(184,153,255,.14);
    --ease: cubic-bezier(.22,1,.36,1);
    --bg: #0e0c16; --bg-top: rgba(184,153,255,.08); --bg-elev: rgba(255,255,255,.035);
    --border: rgba(255,255,255,.09); --border-hover: rgba(184,153,255,.45);
    --fg: #f1eff7; --fg-muted: #aaa7b9; --fg-faint: #908ca1;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --indigo: #2a018a; --indigo-2: #2a018a; --on-indigo: #ffffff; --indigo-soft: rgba(42,1,138,.07);
      --bg: #ffffff; --bg-top: rgba(42,1,138,.04); --bg-elev: rgba(15,18,40,.025);
      --border: rgba(15,18,40,.10); --border-hover: rgba(42,1,138,.45);
      --fg: #0c0d16; --fg-muted: #524f63; --fg-faint: #696677;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: linear-gradient(180deg, var(--bg-top), transparent 320px) no-repeat, var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; line-height: 1.6; min-height: 100svh; overflow-x: hidden;
    display: grid; place-items: center;
  }
  a { color: var(--indigo-2); }
  :focus-visible { outline: 2px solid var(--indigo-2); outline-offset: 3px; border-radius: 4px; }

  .wrap { position: relative; z-index: 1; width: 100%; max-width: 480px; text-align: center;
    padding: max(2rem, env(safe-area-inset-top)) max(1.4rem, env(safe-area-inset-right))
             3rem max(1.4rem, env(safe-area-inset-left)); }

  .mark { display: block; width: fit-content; flex: 0 0 auto; margin: 0 auto 1.6rem; }
  .mark img { display: block; height: 60px; width: auto; }

  .code { font-size: clamp(3.4rem, 16vw, 5.5rem); font-weight: 700; letter-spacing: -.04em; line-height: 1;
    color: var(--indigo-2); }
  h1 { font-size: clamp(1.3rem, 5vw, 1.7rem); font-weight: 650; letter-spacing: -.02em; margin: .8rem 0 .6rem; }
  p { color: var(--fg-muted); max-width: 34ch; margin: 0 auto 2rem; }

  /* stejné hlavní tlačítko jako .button na ostatních stránkách */
  .cta { display: inline-flex; align-items: center; gap: .5rem;
    text-decoration: none; color: var(--on-indigo); font-weight: 550; font-size: .92rem;
    background: var(--indigo); border-radius: 6px; padding: .7rem 1.1rem;
    transition: filter .2s var(--ease); }
  .cta:hover { filter: brightness(1.08); }
  .cta svg { width: 16px; height: 16px; }

  footer { margin-top: 2.4rem; color: var(--fg-faint); font-size: .82rem; }
  footer a { color: var(--fg-muted); text-decoration: none; }
  footer a:hover { color: var(--indigo-2); }

  @media (prefers-reduced-motion: reduce) { *, html { transition: none !important; scroll-behavior: auto; } }
</style>
<script src="/doodles.js"></script>
<script src="/cursors.js"></script>
</head>
<body>
<main class="wrap">
  <picture class="mark"><source srcset="/logo-mark-dark.svg" media="(prefers-color-scheme: dark)"><img src="/logo-mark.svg" alt="" width="52" height="60"></picture>
  <p class="code" aria-hidden="true">404</p>
  <h1>Page not found</h1>
  <p>This address does not exist on our site — it has probably moved, or it never existed.</p>
  <a class="cta" href="/en/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    Back to home
  </a>

  <footer>
    <a href="/en/">Indigo Studio s.r.o.</a>
  </footer>
</main>

</body>
</html>
