<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#F9F6F0">
<title>Audit webu — fakan.cz</title>
<style>
  :root{
    --bg:#F9F6F0;
    --ink:#1F1B16;
    --muted:#8A7E6E;
    --line:#E5E0D6;
    --accent:#C84B31;
    --good:#84A98C;
    --warn:#D4783A;
    --bad:#C84B31;
    --critical:#7B1E1E;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font:16px/1.6 Georgia,'Times New Roman',serif;
    color:var(--ink);
    background:var(--bg);
  }
  header{
    padding:24px 20px;
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;
  }
  header a{color:var(--ink);text-decoration:none;font-weight:bold}
  header .phase{font-size:12px;color:var(--muted)}
  main{max-width:780px;margin:0 auto;padding:32px 20px 80px}

  /* HERO */
  .hero{text-align:center;margin:0 0 48px}
  .hero .domain{
    font-size:18px;color:var(--muted);margin:0 0 8px;
    word-break:break-all;
  }
  .hero h1{font-size:32px;margin:0 0 24px;font-weight:normal}
  .score-circle{
    width:180px;height:180px;margin:0 auto 16px;position:relative;
  }
  .score-circle svg{transform:rotate(-90deg)}
  .score-circle .num{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:64px;font-weight:bold;line-height:1;
  }
  .score-circle .num small{font-size:18px;color:var(--muted);margin-left:4px}
  .label{font-style:italic;font-size:18px;margin:8px 0 0}

  /* AI SUMMARY */
  .ai-summary{
    margin:0 0 48px;padding:24px;background:#fff;border-left:3px solid var(--ink);
    border-radius:0 6px 6px 0;
  }
  .ai-summary h2{
    font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);
    margin:0 0 12px;font-weight:normal;
  }
  .ai-summary p{font-size:18px;line-height:1.5;margin:0;font-style:italic}

  /* BREAKDOWN */
  .breakdown{margin:0 0 48px}
  .breakdown h2{font-size:14px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 16px;font-weight:normal}
  .bar-row{display:grid;grid-template-columns:120px 1fr 48px;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
  .bar-row:last-child{border-bottom:none}
  .bar-label{font-size:14px}
  .bar-track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
  .bar-fill{height:100%;background:var(--ink);transition:width .6s ease}
  .bar-num{font-size:14px;text-align:right;font-variant-numeric:tabular-nums}

  /* SCREENSHOT */
  .screenshot{margin:0 0 48px;text-align:center}
  .screenshot img{
    max-width:280px;width:100%;border:1px solid var(--line);border-radius:6px;
    box-shadow:0 4px 24px rgba(31,27,22,.06);
  }
  .screenshot p{font-size:12px;color:var(--muted);margin:8px 0 0}

  /* SCREENSHOT GALLERY (multi-viewport) */
  .gallery{margin:0 0 48px}
  .gallery h2{font-size:14px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 16px;font-weight:normal}
  .gallery-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));
    gap:16px;
  }
  .gallery-item{text-align:center}
  .gallery-item figure{margin:0}
  .gallery-item img{
    max-width:100%;width:100%;border:1px solid var(--line);border-radius:4px;
    background:#fff;box-shadow:0 2px 12px rgba(31,27,22,.04);
  }
  .gallery-item.dark img{background:#1F1B16}
  .gallery-item figcaption{font-size:12px;color:var(--muted);margin:8px 0 0}

  /* SEO PREVIEW (SERP + OG + Twitter + JSON-LD + robots/sitemap) */
  .seo-preview{margin:0 0 48px}
  .seo-preview h2{font-size:14px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 16px;font-weight:normal}
  .seo-preview h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:24px 0 12px;font-weight:normal}
  .preview-grid{display:grid;grid-template-columns:1fr;gap:16px}
  @media(min-width:680px){
    .preview-grid.two-cols{grid-template-columns:1fr 1fr}
  }

  /* Google SERP náhled (Roboto/Arial, modrý title, breadcrumb URL) */
  .serp-google{
    font:14px/1.5 Arial, sans-serif;background:#fff;padding:16px;border-radius:6px;
    border:1px solid var(--line);
  }
  .serp-google .head{font-size:11px;color:#5f6368;margin:0 0 4px;font-weight:bold;letter-spacing:.3px}
  .serp-google .url{font-size:12px;color:#202124;margin:0 0 4px;line-height:1.4;word-break:break-all}
  .serp-google .url .domain{color:#5f6368}
  .serp-google .title{
    font:20px/1.3 Arial, sans-serif;color:#1a0dab;margin:0 0 4px;font-weight:400;
    cursor:pointer;
  }
  .serp-google .desc{color:#4d5156;font-size:13px;line-height:1.5;margin:0}
  .serp-google .desc.empty{color:#9aa0a6;font-style:italic}

  /* Seznam SERP náhled (jiný font, tmavomodrý title, URL s ›) */
  .serp-seznam{
    font:14px/1.5 'Helvetica Neue', Helvetica, Arial, sans-serif;background:#fff;
    padding:16px;border-radius:6px;border:1px solid var(--line);
  }
  .serp-seznam .head{font-size:11px;color:#666;margin:0 0 4px;font-weight:bold;letter-spacing:.3px}
  .serp-seznam .title{
    font:18px/1.3 'Helvetica Neue', Helvetica, Arial, sans-serif;color:#0066cc;
    margin:0 0 4px;font-weight:600;
  }
  .serp-seznam .url{font-size:12px;color:#3b9c00;margin:0 0 4px;word-break:break-all}
  .serp-seznam .desc{color:#222;font-size:13px;line-height:1.5;margin:0}
  .serp-seznam .desc.empty{color:#999;font-style:italic}

  /* Facebook/LinkedIn OG card */
  .og-card{
    background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;
    font:14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .og-card .img{
    aspect-ratio:1.91/1;background:#f0ede5;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:12px;font-style:italic;
  }
  .og-card .img img{display:block;width:100%;height:100%;object-fit:cover}
  .og-card .body{padding:12px 14px;background:#f7f7f7}
  .og-card .domain{font-size:11px;color:#606770;text-transform:uppercase;letter-spacing:.3px;margin:0 0 4px}
  .og-card .title{font:16px/1.3 inherit;color:#1c1e21;margin:0 0 4px;font-weight:600}
  .og-card .desc{font-size:13px;color:#606770;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .og-card .head{font-size:11px;color:var(--muted);margin:0 0 4px;font-weight:bold;letter-spacing:.3px}

  /* Twitter card */
  .tw-card .img{background:#15202b}
  .tw-card .body{background:#fff;padding:10px 14px}
  .tw-card .domain{color:#536471}
  .tw-card .title{color:#0f1419;font-weight:700}
  .tw-card .desc{color:#536471}

  /* Schema.org list */
  .jsonld-list{
    background:#fff;border:1px solid var(--line);border-radius:6px;padding:16px 20px;margin:0;
  }
  .jsonld-list li{font-size:14px;line-height:1.6;margin:0;list-style:none}
  .jsonld-list li .type{font-weight:bold;color:var(--ink)}
  .jsonld-list li .name{color:var(--muted);margin-left:8px}

  /* Robots/sitemap status řádky */
  .seo-status{background:#fff;border:1px solid var(--line);border-radius:6px;padding:16px 20px}
  .seo-status .row{display:flex;align-items:flex-start;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
  .seo-status .row:last-child{border-bottom:none}
  .seo-status .row .dot{
    flex:0 0 10px;width:10px;height:10px;border-radius:50%;margin-top:7px;background:var(--good);
  }
  .seo-status .row.bad  .dot{background:var(--bad)}
  .seo-status .row.warn .dot{background:var(--warn)}
  .seo-status .row .body{flex:1}
  .seo-status .row .label{font-weight:bold;color:var(--ink);display:block;margin:0 0 2px}
  .seo-status .row .meta{font-size:13px;color:var(--muted);line-height:1.5}

  .preview-empty{
    background:#fff;border:1px dashed var(--line);border-radius:6px;padding:20px;
    text-align:center;color:var(--muted);font-style:italic;font-size:14px;
  }

  /* FINDINGS */
  .findings{margin:0 0 48px}
  .findings h2{font-size:14px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 16px;font-weight:normal}
  .finding{
    padding:16px 20px;background:var(--card);border-radius:6px;margin:0 0 12px;
    border-left:3px solid var(--line);
  }
  .finding[data-sev="critical"]{border-left-color:var(--critical)}
  .finding[data-sev="high"]    {border-left-color:var(--bad)}
  .finding[data-sev="medium"]  {border-left-color:var(--warn)}
  .finding[data-sev="low"]     {border-left-color:var(--muted)}
  .finding-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .finding-title{font-weight:bold;font-size:16px;margin:0}
  .finding-cat{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
  .finding-detail{font-size:14px;color:var(--ink);margin:8px 0 0;opacity:.85}
  .finding-fix{font-size:13px;color:var(--muted);margin:8px 0 0;font-style:italic}

  /* STRATEGIST */
  .variants{margin:48px 0}
  .variants h2{font-size:14px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 16px;font-weight:normal}
  .variants .head-line{font-size:24px;margin:0 0 8px;font-weight:normal}
  .variants .risks{font-size:14px;color:var(--muted);margin:0 0 32px;font-style:italic;border-left:2px solid var(--line);padding-left:16px}
  .variant{
    padding:24px;background:var(--card);border-radius:6px;margin:0 0 16px;
    border-left:3px solid var(--good);
  }
  .variant.redesign{border-left-color:var(--warn)}
  .variant.new     {border-left-color:var(--accent)}
  .variant-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  .variant-title{font-size:20px;margin:0;font-weight:normal}
  .variant-meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .variant ul{margin:16px 0;padding-left:20px;font-size:14px;line-height:1.7}
  .variant .best-for{font-size:13px;color:var(--muted);font-style:italic;margin:0}

  /* CTA */
  .cta{
    text-align:center;padding:48px 24px;background:var(--ink);color:var(--bg);
    border-radius:6px;margin:48px 0 0;
  }
  .cta h2{font-size:24px;margin:0 0 16px;font-weight:normal}
  .cta p{font-size:14px;margin:0 0 24px;opacity:.8}
  .btn{
    display:inline-block;background:var(--accent);color:#fff;padding:14px 28px;
    text-decoration:none;border-radius:4px;font-weight:bold;font-family:inherit;
  }
  .btn:hover{background:#A93D27}
  .cta-alt{display:block;color:#fff;opacity:.7;margin-top:16px;font-size:14px;text-decoration:none}

  /* LOADING */
  .loading{text-align:center;padding:120px 20px;color:var(--muted)}
  .loading .spinner{
    display:inline-block;width:32px;height:32px;border:3px solid var(--line);
    border-top-color:var(--ink);border-radius:50%;animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  footer{text-align:center;padding:32px 20px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:48px}
  footer a{color:var(--muted)}

  @media(max-width:520px){
    .hero h1{font-size:24px}
    .score-circle{width:140px;height:140px}
    .score-circle .num{font-size:48px}
    .bar-row{grid-template-columns:90px 1fr 40px;gap:12px}
  }
</style>
</head>
<body>

<header>
  <a href="https://fakan.cz">fakan.cz</a>
  <span class="phase">audit</span>
</header>

<main id="root">
  <div class="loading">
    <div class="spinner" aria-hidden="true"></div>
    <p>Načítání reportu…</p>
  </div>
</main>

<footer>
  © 2026 · provozuje Indigo Studio s.r.o. ·
  <a href="mailto:jsem@fakan.cz">jsem@fakan.cz</a>
</footer>

<script type="module">
// Frontend i API jedou na fakan.cz (jeden Worker, same-origin).
// Audit data: GET /api/audit/{token}/data, screenshot: GET /api/screenshot/{auditId}.

const root = document.getElementById('root');
const token = location.pathname.split('/').filter(Boolean)[1];

const SEV_LABEL = { critical:'kritické', high:'vysoké', medium:'střední', low:'nízké', info:'info' };
const CAT_LABEL = {
  perf:'výkon', a11y:'přístupnost', visual:'vizuál', content:'obsah',
  seo:'SEO', cookie:'cookies', sec:'zabezpečení', cms:'CMS', error:'chyba',
};

const SHOT_LABEL = {
  mobilePortrait:  'Mobil (na výšku)',
  mobileLandscape: 'Mobil (na šířku)',
  desktop:         'Desktop',
  mobileDark:      'Mobil — tmavý režim',
};

const SHOT_KIND = {
  mobilePortrait:  'mobile-portrait',
  mobileLandscape: 'mobile-landscape',
  desktop:         'desktop',
  mobileDark:      'mobile-dark',
};

// Audit může být v okamžiku otevření ještě v běhu (queued/running) — typicky
// když user přijde rovnou z form submitu. Polling: každé 3 s zkus znovu, max
// ~3 min. 404 = report token neexistuje (žádný retry, error rovnou).
const POLL_MS = 3000;
const MAX_POLLS = 60;

(async () => {
  let polls = 0;
  while (polls++ < MAX_POLLS) {
    let payload;
    try {
      const resp = await fetch(`/api/audit/${token}/data`);
      if (resp.status === 404) return showMissing();
      if (!resp.ok) throw new Error('http ' + resp.status);
      payload = await resp.json();
    } catch (err) {
      if (polls >= MAX_POLLS) return showMissing();
      await sleep(POLL_MS);
      continue;
    }

    if (payload.audit.status === 'queued' || payload.audit.status === 'running') {
      renderRunning(payload.audit);
      await sleep(POLL_MS);
      continue;
    }

    return render(payload.audit, payload.findings, payload.strategist, payload.screenshots || {}, payload.ai_summary, payload.seo_preview || null);
  }
  showMissing();
})();

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function showMissing() {
  root.innerHTML = `<div class="loading"><p>Tento report neexistuje nebo vypršel.</p>
    <p><a href="https://fakan.cz">Zpět na fakan.cz</a></p></div>`;
}

function renderRunning(audit) {
  root.innerHTML = `
    <div class="loading">
      <div class="spinner" aria-hidden="true"></div>
      <p style="margin-top:24px;font-size:18px">Auditujeme ${esc(audit.domain)}…</p>
      <p style="font-size:14px;color:var(--muted)">Hotovo do pár sekund. Stránka se sama obnoví.</p>
    </div>`;
}

function render(audit, findings, strat, shots, aiSummary, seoPreview) {
  const score = audit.score ?? 0;
  const label = scoreLabel(score);

  // Vizuál a Obsah zobrazujeme jen když je má backend (nové audity).
  // Staré audity ze stejné DB ty hodnoty mít nebudou — tvar se přizpůsobí.
  const bars = [
    ['Výkon',        audit.perf_score],
    ['Přístupnost',  audit.a11y_score],
    audit.visual_score  != null ? ['Vizuál', audit.visual_score]  : null,
    audit.content_score != null ? ['Obsah',  audit.content_score] : null,
    ['Cookies',      audit.cookie_score],
    ['SEO',          audit.seo_score],
    ['Zabezpečení',  audit.sec_score],
  ].filter(Boolean);

  const findingsHtml = findings.length
    ? findings.map(f => `
      <div class="finding" data-sev="${f.severity}">
        <div class="finding-head">
          <h3 class="finding-title">${esc(f.title)}</h3>
          <span class="finding-cat">${CAT_LABEL[f.category] || f.category}</span>
        </div>
        ${f.detail ? `<p class="finding-detail">${esc(f.detail)}</p>` : ''}
        ${f.fix_hint ? `<p class="finding-fix">${esc(f.fix_hint)}</p>` : ''}
      </div>`).join('')
    : '<p style="color:var(--muted)">Žádné problémy. Sláva.</p>';

  const variantsHtml = strat ? renderVariants(strat) : '';

  root.innerHTML = `
    <section class="hero">
      <p class="domain">${esc(audit.domain)}</p>
      <h1>Audit webu</h1>
      <div class="score-circle" aria-label="Skóre ${score} ze 100">
        <svg width="180" height="180" viewBox="0 0 180 180">
          <circle cx="90" cy="90" r="80" fill="none" stroke="var(--line)" stroke-width="8"/>
          <circle cx="90" cy="90" r="80" fill="none" stroke="var(--ink)" stroke-width="8"
                  stroke-dasharray="${(score/100*502.65).toFixed(1)} 502.65"
                  stroke-linecap="round"/>
        </svg>
        <div class="num">${score}<small>/100</small></div>
      </div>
      <p class="label">${esc(label)}</p>
    </section>

    ${aiSummary ? `
    <section class="ai-summary">
      <h2>Co o webu říká AI</h2>
      <p>${esc(aiSummary)}</p>
    </section>` : ''}

    <section class="breakdown">
      <h2>Rozpis kategorií</h2>
      ${bars.map(([n,v]) => `
        <div class="bar-row">
          <div class="bar-label">${n}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${v||0}%"></div></div>
          <div class="bar-num">${v ?? '–'}</div>
        </div>`).join('')}
    </section>

    ${renderGallery(audit, shots)}

    ${renderSeoPreview(audit, seoPreview)}

    <section class="findings">
      <h2>Co konkrétně</h2>
      ${findingsHtml}
    </section>

    ${variantsHtml}

    <section class="cta">
      <h2>Chcete, abychom to vyřešili?</h2>
      <p>Pevná cena. Žádné kecy. Hotovo do tří týdnů.</p>
      <a class="btn" href="mailto:jsem@fakan.cz?subject=${encodeURIComponent('Web ' + audit.domain)}">Napište nám</a>
      <a class="cta-alt" href="tel:+420604690539">Nebo zavolejte: +420 604 690 539</a>
    </section>
  `;
}

// --- SEO náhledy: SERP (Google + Seznam) + OG + Twitter + JSON-LD + robots/sitemap ---

function renderSeoPreview(audit, seo) {
  if (!seo) return '';

  const url = audit.url || `https://${audit.domain}/`;
  const domain = audit.domain || '';

  const title = seo.title || '';
  const desc  = seo.metaDescription || '';

  // Title si Google sám zkrátí, my pro náhled emulujeme cropping ~60 znaků.
  const titleGoogle = title ? truncMid(title, 60) : '(stránka nemá <title>)';
  const titleSeznam = title ? truncMid(title, 65) : '(stránka nemá titulek)';
  const descGoogle  = desc  ? truncMid(desc, 160) : '';
  const descSeznam  = desc  ? truncMid(desc, 200) : '';

  const breadcrumb = urlBreadcrumb(url, domain);

  // OG / Twitter náhled — preferujeme OG, fallback na meta description / title.
  const og = seo.og || {};
  const tw = seo.twitter || {};
  const ogImage = og.image || tw.image || null;
  const ogTitle = og.title || tw.title || title;
  const ogDesc  = og.description || tw.description || desc;
  const hasAnyOg = Boolean(og.title || og.description || og.image || tw.title || tw.image);

  const fbCard = `
    <div class="og-card" aria-label="Náhled sdílení na Facebooku a LinkedInu">
      <p class="head" style="padding:8px 14px 0;margin:0;color:var(--muted)">Sdílení na Facebooku / LinkedInu</p>
      <div class="img">${ogImage ? `<img src="${esc(ogImage)}" alt="" onerror="this.parentElement.textContent='(obrázek se nenačetl)'">` : '(žádný náhled — chybí og:image)'}</div>
      <div class="body">
        <p class="domain">${esc(domain.toLowerCase())}</p>
        <p class="title">${esc(ogTitle || '(bez titulku)')}</p>
        ${ogDesc ? `<p class="desc">${esc(ogDesc)}</p>` : ''}
      </div>
    </div>`;

  const twCard = (tw.title || tw.image) ? `
    <div class="og-card tw-card" aria-label="Náhled sdílení na X (Twitteru)">
      <p class="head" style="padding:8px 14px 0;margin:0;color:var(--muted)">Sdílení na X (Twitter)</p>
      <div class="img">${tw.image ? `<img src="${esc(tw.image)}" alt="" onerror="this.parentElement.textContent='(obrázek se nenačetl)'">` : '(bez obrázku)'}</div>
      <div class="body">
        <p class="domain">${esc(domain.toLowerCase())}</p>
        <p class="title">${esc(tw.title || ogTitle || '(bez titulku)')}</p>
        ${(tw.description || ogDesc) ? `<p class="desc">${esc(tw.description || ogDesc)}</p>` : ''}
      </div>
    </div>` : '';

  // Schema.org JSON-LD list.
  const jsonLdHtml = (seo.jsonLd && seo.jsonLd.length) ? `
    <h3>Co o vás vyhledávače ví (Schema.org)</h3>
    <ul class="jsonld-list">
      ${seo.jsonLd.map((it) => `
        <li><span class="type">${esc(it.type)}</span>${it.name ? `<span class="name">— ${esc(it.name)}</span>` : ''}</li>
      `).join('')}
    </ul>` : '';

  // Robots / sitemap status
  const robotsRow = renderRobotsRow(seo.robots);
  const sitemapRow = renderSitemapRow(seo.sitemap);

  return `
    <section class="seo-preview">
      <h2>Jak vás vidí vyhledávače</h2>
      <div class="preview-grid two-cols">
        <div class="serp-google">
          <p class="head">Google</p>
          <p class="url">
            <span class="domain">${esc(domain)}</span>
            ${breadcrumb ? ` › ${esc(breadcrumb)}` : ''}
          </p>
          <p class="title">${esc(titleGoogle)}</p>
          <p class="desc${desc ? '' : ' empty'}">${desc ? esc(descGoogle) : '(žádný popis stránky — Google si vymyslí svůj.)'}</p>
        </div>
        <div class="serp-seznam">
          <p class="head">Seznam</p>
          <p class="title">${esc(titleSeznam)}</p>
          <p class="url">${esc(domain)}${breadcrumb ? ` › ${esc(breadcrumb)}` : ''}</p>
          <p class="desc${desc ? '' : ' empty'}">${desc ? esc(descSeznam) : '(žádný popis stránky.)'}</p>
        </div>
      </div>

      <h3>Jak vypadá sdílení Vašeho webu</h3>
      ${hasAnyOg
        ? `<div class="preview-grid${twCard ? ' two-cols' : ''}">
             ${fbCard}
             ${twCard}
           </div>`
        : `<div class="preview-empty">Web nemá Open Graph tagy. Při sdílení na sociálních sítích se zobrazí jen URL bez obrázku, titulku i popisu.</div>`
      }

      ${jsonLdHtml}

      <h3>Robots a mapa webu</h3>
      <div class="seo-status">
        ${robotsRow}
        ${sitemapRow}
      </div>
    </section>
  `;
}

function renderRobotsRow(r) {
  if (!r || !r.exists) {
    return `
      <div class="row warn">
        <div class="dot"></div>
        <div class="body">
          <span class="label">robots.txt — chybí</span>
          <span class="meta">Vyhledávače nedostanou pokyny, kam smějí a kde najdou mapu webu.</span>
        </div>
      </div>`;
  }
  if (r.disallowAll) {
    return `
      <div class="row bad">
        <div class="dot"></div>
        <div class="body">
          <span class="label">robots.txt — zakazuje celý web</span>
          <span class="meta">Soubor obsahuje "Disallow: /". Google ani Seznam web nezaindexují.</span>
        </div>
      </div>`;
  }
  return `
    <div class="row">
      <div class="dot"></div>
      <div class="body">
        <span class="label">robots.txt — v pořádku</span>
        <span class="meta">${r.sitemapUrls && r.sitemapUrls.length ? `Odkazuje na sitemap: ${esc(r.sitemapUrls[0])}` : 'Bez odkazu na sitemap.'}</span>
      </div>
    </div>`;
}

function renderSitemapRow(s) {
  if (!s || !s.exists) {
    return `
      <div class="row warn">
        <div class="dot"></div>
        <div class="body">
          <span class="label">sitemap.xml — chybí</span>
          <span class="meta">Mapa webu pomáhá Googlu najít všechny stránky, hlavně u nových webů.</span>
        </div>
      </div>`;
  }
  if (s.urlCount === 0) {
    return `
      <div class="row warn">
        <div class="dot"></div>
        <div class="body">
          <span class="label">sitemap.xml — prázdná</span>
          <span class="meta">Soubor existuje, ale neobsahuje žádné URL.</span>
        </div>
      </div>`;
  }
  const kindLabel = s.kind === 'index' ? `${s.urlCount} pod-mapy` : `${s.urlCount} ${pluralCs(s.urlCount, 'URL', 'URL', 'URL')}`;
  return `
    <div class="row">
      <div class="dot"></div>
      <div class="body">
        <span class="label">sitemap.xml — v pořádku</span>
        <span class="meta">${esc(kindLabel)}${s.truncated ? ' (zobrazujeme jen prvních ' + s.urlCount + ').' : '.'}</span>
      </div>
    </div>`;
}

function urlBreadcrumb(url, domain) {
  try {
    const u = new URL(url);
    const path = u.pathname.replace(/\/$/, '').replace(/^\//, '');
    if (!path) return '';
    return path.split('/').join(' › ');
  } catch { return ''; }
}

function truncMid(str, max) {
  if (!str) return '';
  if (str.length <= max) return str;
  return str.slice(0, max - 1).replace(/\s+\S*$/, '') + '…';
}

function pluralCs(n, one, few, many) {
  if (n === 1) return one;
  if (n >= 2 && n <= 4) return few;
  return many;
}

function renderGallery(audit, shots) {
  // Pořadí v galerii: portrait → landscape → desktop → dark.
  // Staré audity (před vizuálními checky) shots prázdný objekt → fallback
  // na původní /api/screenshot/{auditId} jednoobrázkový náhled.
  const order = ['mobilePortrait', 'mobileLandscape', 'desktop', 'mobileDark'];
  const present = order.filter((k) => shots[k]);

  if (present.length === 0) {
    return `
      <section class="screenshot">
        <img src="/api/screenshot/${audit.id}"
             alt="Náhled webu na mobilu" loading="lazy"
             onerror="this.style.display='none'">
        <p>Jak Váš web vidí návštěvník na mobilu.</p>
      </section>`;
  }

  const items = present.map((k) => `
    <div class="gallery-item${k === 'mobileDark' ? ' dark' : ''}">
      <figure>
        <img src="/api/screenshot/${audit.id}/${SHOT_KIND[k]}"
             alt="${esc(SHOT_LABEL[k])}" loading="lazy"
             onerror="this.parentElement.parentElement.style.display='none'">
        <figcaption>${esc(SHOT_LABEL[k])}</figcaption>
      </figure>
    </div>`).join('');

  return `
    <section class="gallery">
      <h2>Jak Váš web vypadá</h2>
      <div class="gallery-grid">${items}</div>
    </section>`;
}

function renderVariants(s) {
  if (!s) return '';
  const v = (data, cls) => data ? `
    <div class="variant ${cls}">
      <div class="variant-head">
        <h3 class="variant-title">${esc(data.title)}</h3>
        <span class="variant-meta">${fmtPrice(data.price_from)}–${fmtPrice(data.price_to)} Kč · ${data.days} dní</span>
      </div>
      <ul>${(data.what || []).map(b => `<li>${esc(b)}</li>`).join('')}</ul>
      <p class="best-for">${esc(data.best_for || '')}</p>
    </div>` : '';

  return `
    <section class="variants">
      <h2>Co s tím můžeme udělat</h2>
      <p class="head-line">${esc(s.headline || '')}</p>
      <p class="risks">${esc(s.risks || '')}</p>
      ${v(s.fix, 'fix')}
      ${v(s.redesign, 'redesign')}
      ${v(s.new, 'new')}
    </section>`;
}

function scoreLabel(s) {
  if (s >= 90) return 'Lepší než 95 % toho, co vidíme. Klobouk dolů.';
  if (s >= 70) return 'Slušný. Tři opravy by zvedly skóre o 15 bodů.';
  if (s >= 50) return 'Funguje. Ale na mobilu vás to stojí návštěvníky.';
  if (s >= 30) return 'Návštěvníkovi to vadí, jen vám to ještě neřekl.';
  return 'Tady už ani Google nehledá cestu zpět.';
}
const fmtPrice = (n) => (n || 0).toLocaleString('cs-CZ');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
</script>
