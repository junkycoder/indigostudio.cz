<style>
  :root {
    --indigo: #6366f1;
    --indigo-2: #818cf8;
    --indigo-soft: rgba(99, 102, 241, 0.14);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  html[data-theme="dark"] {
    --bg: #0b0b12;
    --bg-elev: rgba(255, 255, 255, 0.035);
    --border: rgba(255, 255, 255, 0.09);
    --border-hover: rgba(129, 140, 248, 0.45);
    --fg: #f4f4f6;
    --fg-muted: #a1a1ad;
    --fg-faint: #6b6b78;
    --glow: rgba(99, 102, 241, 0.16);
  }
  html[data-theme="light"] {
    --bg: #ffffff;
    --bg-elev: rgba(15, 18, 40, 0.025);
    --border: rgba(15, 18, 40, 0.10);
    --border-hover: rgba(99, 102, 241, 0.5);
    --fg: #15161d;
    --fg-muted: #5a5b6a;
    --fg-faint: #9a9ba8;
    --glow: rgba(99, 102, 241, 0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    line-height: 1.5;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    transition: background 0.4s var(--ease), color 0.4s var(--ease);
  }

  /* pointer-reactive glow */
  .glow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(420px circle at var(--mx, 50%) var(--my, 28%), var(--glow), transparent 70%);
    transition: background 0.2s linear;
  }

  .theme-toggle {
    position: fixed;
    top: max(1rem, env(safe-area-inset-top));
    right: max(1rem, env(safe-area-inset-right));
    z-index: 3;
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg-elev);
    color: var(--fg-muted);
    cursor: pointer;
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    transition: border-color 0.25s var(--ease), color 0.25s var(--ease), transform 0.25s var(--ease);
  }
  .theme-toggle:hover { border-color: var(--border-hover); color: var(--fg); transform: translateY(-1px); }
  .theme-toggle svg { width: 20px; height: 20px; }
  html[data-theme="dark"] .theme-toggle .sun { display: block; }
  html[data-theme="dark"] .theme-toggle .moon { display: none; }
  html[data-theme="light"] .theme-toggle .sun { display: none; }
  html[data-theme="light"] .theme-toggle .moon { display: block; }

  main {
    position: relative;
    z-index: 1;
    flex: 1;
    width: 100%;
    max-width: 780px;
    margin: 0 auto;
    padding: clamp(2.5rem, 6vh, 5rem) 1.5rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: clamp(1.75rem, 4vh, 2.75rem);
  }

  .brand { display: flex; align-items: center; gap: 0.7rem; }
  .mark {
    width: 38px; height: 38px; border-radius: 11px;
    background: linear-gradient(135deg, var(--indigo), var(--indigo-2));
    box-shadow: 0 6px 24px -6px var(--indigo);
  }
  .brand h1 {
    font-size: clamp(1.5rem, 4.5vw, 2rem);
    font-weight: 650;
    letter-spacing: -0.02em;
  }
  .brand h1 .accent { color: var(--indigo-2); }

  .lead {
    font-size: clamp(1.05rem, 3.2vw, 1.45rem);
    font-weight: 400;
    color: var(--fg);
    max-width: 30ch;
    letter-spacing: -0.01em;
  }
  .lead .muted { color: var(--fg-muted); }

  .contacts {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.75rem;
  }
  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.6rem;
    padding: 1.4rem 1rem;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: var(--bg-elev);
    text-decoration: none;
    color: inherit;
    transition: border-color 0.25s var(--ease), transform 0.25s var(--ease), background 0.25s var(--ease);
  }
  .card:hover { border-color: var(--border-hover); transform: translateY(-3px); }

  .avatar {
    width: 64px; height: 64px;
    border-radius: 50%;
    position: relative;
    overflow: hidden;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, var(--indigo-soft), transparent);
    border: 1px solid var(--border);
    color: var(--indigo-2);
    font-weight: 600;
    font-size: 1.1rem;
    letter-spacing: 0.02em;
  }
  .avatar img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .card .name { font-weight: 550; font-size: 0.97rem; }
  .card .email { color: var(--fg-muted); font-size: 0.85rem; word-break: break-word; }
  .card .phone { color: var(--fg-muted); font-size: 0.85rem; }
  .card:hover .email, .card:hover .phone { color: var(--indigo-2); }

  .company {
    color: var(--fg-faint);
    font-size: 0.8rem;
    line-height: 1.7;
    max-width: 46ch;
  }
  .company strong { color: var(--fg-muted); font-weight: 550; }
  .company .sep { opacity: 0.4; padding: 0 0.4rem; }

  @media (max-width: 560px) {
    .contacts { grid-template-columns: 1fr; max-width: 360px; margin: 0 auto; }
    .card { flex-direction: row; text-align: left; gap: 1rem; padding: 1rem 1.2rem; }
    .card .avatar { width: 52px; height: 52px; flex: 0 0 auto; }
    .card .meta { display: flex; flex-direction: column; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    .glow { display: none; }
  }
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>

<button class="theme-toggle" id="themeToggle" type="button" aria-label="Přepnout světlý/tmavý režim" title="Přepnout režim">

    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
  </svg>
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
  </svg>
</button>

    <a class="card" href="mailto:daniel@indigostudio.cz">

      <span class="meta">

  <p class="company">
    <strong>Indigo Studio s.r.o.</strong><span class="sep">·</span>IČO 14389096<br>
    Chudenická 1059/30, Hostivař, 102 00 Praha<span class="sep">·</span>č. ú. 2802169026/2010 (Fio)
  </p>
</main>

<script>
  (function () {
    var root = document.documentElement;
    var stored = null;
    try { stored = localStorage.getItem("theme"); } catch (e) {}
    if (stored === "light" || stored === "dark") {
      root.setAttribute("data-theme", stored);
    } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
      root.setAttribute("data-theme", "light");
    }

    document.getElementById("themeToggle").addEventListener("click", function () {
      var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("theme", next); } catch (e) {}
    });

    // jemný glow za kurzorem / dotykem
    if (!window.matchMedia || !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      var glow = document.querySelector(".glow");
      window.addEventListener("pointermove", function (e) {
        glow.style.setProperty("--mx", e.clientX + "px");
        glow.style.setProperty("--my", e.clientY + "px");
      }, { passive: true });
    }
  })();
</script>
</body>
