name = "indigostudio"
main = "src/worker.js"
compatibility_date = "2025-04-01"

# ----- Routing -----
# Worker drží celý indigostudio.cz (statická vizitka) — apex i www.
[[routes]]
pattern = "indigostudio.cz"
zone_name = "indigostudio.cz"
custom_domain = true

[[routes]]
pattern = "www.indigostudio.cz"
zone_name = "indigostudio.cz"
custom_domain = true

# ----- Email Sending (fallback pro poptávkový formulář) -----
# Primárně poptávky jdou přes Resend (HTTP API, secret RESEND_API_KEY).
# Tohle je fallback, když RESEND_API_KEY není nastaven — posílá na ověřenou
# destinaci v Email Routingu. Pozn.: po přesunu MX na Zoho nemusí fungovat.
[[send_email]]
name = "SEB"
destination_address = "hromada.dan@gmail.com"

# ----- Statusboard mBlue (neveřejná ministránka pro tým) -----
# Vlastní subdoména, aby se vizitka a interní nástroj nemíchaly na jedné adrese.
[[routes]]
pattern = "mblue.indigostudio.cz"
zone_name = "indigostudio.cz"
custom_domain = true

# Hodnocení, členové a přihlášení statusboardu.
[[d1_databases]]
binding = "DB"
database_name = "mblue-statusboard"
database_id = "29497ae8-5a6d-49bb-8bf5-2921c174f7ea"

# Stránka statusboardu se importuje do Workeru jako text — schválně NENÍ v `public/`,
# aby ji nešlo stáhnout mimo přihlášení (assets se servírují bez kontroly session).
[[rules]]
type = "Text"
globs = ["**/*.page.html"]
fallthrough = true

# ----- Static assets -----
# public/ obsahuje vizitku (index.html), og.png, favicon, robots, sitemap.
# run_worker_first = true → Worker běží i pro statiku, aby stihl doplnit
# bezpečnostní hlavičky (jinak CF servíruje asset přímo a Worker se přeskočí).
[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true
# neexistující cesty → vlastní hezká 404 (public/404.html) se stavem 404
not_found_handling = "404-page"
