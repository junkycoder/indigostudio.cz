name = "indigostudio"
main = "src/worker.js"
compatibility_date = "2025-04-01"

# ----- Routing -----
# Worker drží celý indigostudio.cz (statická vizitka).
[[routes]]
pattern = "indigostudio.cz"
zone_name = "indigostudio.cz"
custom_domain = true

# ----- Static assets -----
# public/ obsahuje vizitku (index.html), og.png, favicon, robots, sitemap.
[assets]
directory = "public"
binding = "ASSETS"
