name = "fakan-cz"
main = "src/worker.js"
compatibility_date = "2025-05-01"

# Custom domain — přidáno přes dashboard při migraci z Pages → Workers (2026-05-07).
# Zafixováno v repu, aby ho lokální `wrangler deploy` neodhlásil. wrangler.toml = source of truth.
[[routes]]
pattern = "fakan.cz"
zone_name = "fakan.cz"
custom_domain = true

[placement]
mode = "smart"

[assets]
directory = "fakan.cz"
# /odhlasit* musí jít přes Worker (DB update opt-out tokenu), ne přes statiku.
# Form pro audit jde z prohlížeče POSTem rovnou na api.fakan.cz, tady ho neřešíme.
run_worker_first = ["/odhlasit*"]

# D1 — lead tabulka pro opt-out flow (lookup unsubscribe_token → email).
# Po deprekaci analyze flow píše do ní jen optout.js (UPDATE status='opted_out').
# Migration v migrations/0001_leads.sql.
[[d1_databases]]
binding = "DB"
database_name = "fakan_leads"
database_id = "4e9b7569-b422-4b02-ad99-aa50c773ee4f"

# Email Workers — outbound mail (opt-out confirmation).
# Vyžaduje verified doménu fakan.cz v Email Routing dashboardu.
[[send_email]]
name = "EMAIL"
