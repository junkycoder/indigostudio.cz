name = "fakan"
main = "src/worker.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# ----- Browser Rendering -----
# Top-level binding — v TOMLu MUSÍ být před prvním [...] / [[...]] headerem,
# jinak ho parser přiřadí poslední sekci a wrangler hodí "Unexpected fields".
browser = { binding = "MYBROWSER" }

# ----- Routing -----
# Worker drží celý fakan.cz: landing, audit pipeline, audit report SPA,
# opt-out, plus budoucí featury (placené návrhy, nákup domény).
[[routes]]
pattern = "fakan.cz"
zone_name = "fakan.cz"
custom_domain = true

# ----- Static assets -----
# public/ obsahuje landing (index.html, ochrana-udaju, …) + audit-page (audit/index.html).
# run_worker_first jako array — Worker dostane priority jen pro dynamické cesty.
# Pro /audit/* je to klíčové: jinak asset binding udělá canonicalization redirect
# na /audit/ pro neznámé tokeny místo aby pustil Worker rewrite na index.html.
# Statiku (/, /ochrana-udaju, /audit/index.html …) servuje asset binding přímo.
[assets]
directory = "public"
binding = "ASSETS"
# html_handling = default ("auto-trailing-slash") — drop .html z URL,
# force trailing slash pro directory s index.html (/ochrana-udaju.html → /ochrana-udaju,
# /audit/ → /audit/index.html). Worker při rewrite na audit-page volá
# env.ASSETS.fetch(/audit/), ne /audit/index.html, jinak vznikne 307 loop.
run_worker_first = [
  "/api/*",
  "/audit/*",
  "/navrh/*",
  "/domena/objednat",
  "/domena/objednat/*",
  "/domena/stav/*",
  "/odhlasit",
  "/odhlasit/*",
  "/unsubscribe",
  "/screenshot/*",
]

# ----- D1 -----
[[d1_databases]]
binding = "DB"
database_name = "fakan_auditor"
database_id = "c7cc11ac-3769-4f72-ab62-09da19be6612"

# ----- KV (cache + rate limit) -----
[[kv_namespaces]]
binding = "AUDIT_CACHE"
id = "3cd4711675f64a21ba22d5932c4a6f2b"

# Title v CF dashboardu = "AUDITOR_RATELIMIT". Binding name `RATELIMIT`
# zůstává — kód v handlers/audit.js používá env.RATELIMIT.
[[kv_namespaces]]
binding = "RATELIMIT"
id = "4735d070d7534677a653cf190de4911b"

# ----- R2 (uložené reporty + screenshoty) -----
[[r2_buckets]]
binding = "REPORTS"
bucket_name = "fakan-reports"

# ----- Queues -----
[[queues.producers]]
binding = "AUDIT_QUEUE"
queue = "fakan-audit-jobs"

[[queues.consumers]]
queue = "fakan-audit-jobs"
# @cloudflare/puppeteer má per-account concurrency limit (default 2).
# max_batch_size > 2 = 503 z Browser Renderingu při souběhu auditů.
max_batch_size = 2
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "fakan-audit-dlq"

# ----- Cron pro follow-upy -----
[triggers]
crons = ["*/15 * * * *"]   # každých 15 min — vyhodnotit naplánované maily

# ----- Veřejné proměnné (lze do repa, nejsou tajné) -----
[vars]
# Stripe publishable key — pošle ho frontend k Payment Elementu. Není citlivý
# (sám Stripe ho čeká v JS bundlu klienta). Pro dev override .dev.vars.
STRIPE_PUBLISHABLE_KEY = ""   # Fakan vyplní 'pk_live_…' (test 'pk_test_…')

# ----- Tajemství (wrangler secret put …) -----
# RESEND_API_KEY
# ANTHROPIC_API_KEY
# PUBLIC_HOST           = "fakan.cz"   (jen jeden hostname po sjednocení)
# STRIPE_SECRET_KEY     = sk_live_… (test: sk_test_…)
# STRIPE_WEBHOOK_SECRET = whsec_…   (z Dashboard → Webhooks → fakan.cz endpoint)
