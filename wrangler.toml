name = "indigo-studio"
main = "src/worker.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# ----- Browser Rendering -----
# Top-level binding — v TOMLu MUSÍ být před prvním [...] / [[...]] headerem,
# jinak ho parser přiřadí poslední sekci a wrangler hodí "Unexpected fields".
browser = { binding = "MYBROWSER" }

# ----- Routing -----
# Worker drží celou primary doménu: landing, audit pipeline, audit report SPA,
# opt-out, placené návrhy, nákup/převod domén.
#
# Cíl: po nákupu indigostudio.cz a DNS propagaci přidat:
#
#   [[routes]]
#   pattern = "indigostudio.cz"
#   zone_name = "indigostudio.cz"
#   custom_domain = true
#
# Zatím deployujeme bez routes — Worker poběží jen na vlastní
# `indigo-studio.<account>.workers.dev` subdoméně, ať si během transition
# nešlapeme na route `fakan.cz` (kterou drží legacy `fakan` Worker).
#
# `fakan.cz` zůstane bydlištěm fakan Workeru, dokud:
#   1) nasadíme indigostudio.cz (ETAPA 5)
#   2) odebereme audit/suggestion/domain pipeline z fakan Workeru (cutoff)
#   3) na fakan.cz nasadíme samostatný personal-site Worker (Daniel CV +
#      odkaz na indigostudio.cz)
#
# Routes záměrně prázdné — žádný [[routes]] block tu zatím nepatří.

# ----- Static assets -----
# public/ obsahuje landing (index.html, ochrana-udaju, …) + audit-page (audit/index.html).
# run_worker_first jako array — Worker dostane priority jen pro dynamické cesty.
# Pro /audit/* je to klíčové: jinak asset binding udělá canonicalization redirect
# na /audit/ pro neznámé tokeny místo aby pustil Worker rewrite na index.html.
# Statiku (/, /ochrana-udaju, /audit/index.html …) servuje asset binding přímo.
[assets]
directory = "public"
binding = "ASSETS"
# html_handling = default ("auto-trailing-slash") — drop .html z URL,
# force trailing slash pro directory s index.html (/ochrana-udaju.html → /ochrana-udaju,
# /audit/ → /audit/index.html). Worker při rewrite na audit-page volá
# env.ASSETS.fetch(/audit/), ne /audit/index.html, jinak vznikne 307 loop.
run_worker_first = [
  "/api/*",
  "/audit/*",
  "/navrh/*",
  "/domena/objednat",
  "/domena/objednat/*",
  "/domena/stav/*",
  "/odhlasit",
  "/odhlasit/*",
  "/unsubscribe",
  "/screenshot/*",
]

# ----- D1 -----
# database_name a binding ID zůstávají (po rebrandu lze přejmenovat v CF dashboardu,
# Worker se k DB váže přes database_id, takže rename je bez dopadu na deploy).
[[d1_databases]]
binding = "DB"
database_name = "fakan_auditor"
database_id = "c7cc11ac-3769-4f72-ab62-09da19be6612"

# ----- KV (cache + rate limit) -----
[[kv_namespaces]]
binding = "AUDIT_CACHE"
id = "3cd4711675f64a21ba22d5932c4a6f2b"

# Title v CF dashboardu = "AUDITOR_RATELIMIT". Binding name `RATELIMIT`
# zůstává — kód v handlers/audit.js používá env.RATELIMIT.
[[kv_namespaces]]
binding = "RATELIMIT"
id = "4735d070d7534677a653cf190de4911b"

# ----- R2 (uložené reporty + screenshoty) -----
# bucket_name zůstává (po rebrandu lze přejmenovat v CF dashboardu — Worker
# binding ID zůstává platný).
[[r2_buckets]]
binding = "REPORTS"
bucket_name = "fakan-reports"

# ----- Queues -----
# queue name `fakan-audit-jobs` zůstává — Cloudflare queues nepodporují rename,
# přejmenování by vyžadovalo migrate (vytvořit novou queue + draining staré).
# Mimo MVP rozsah.
#
# Producer zůstává — i idle indigo-studio Worker by mohl v budoucnu enqueue
# úkoly (např. ze CLI testů, scheduled deploy hooks).
#
# Consumer + cron zatím NEpřidáváme — dokud `fakan` Worker servuje produkční
# traffic, drží si konzumenta i dispatcher mailů on. Po cutoffu (ETAPA 7):
#
#   [[queues.consumers]]
#   queue = "fakan-audit-jobs"
#   max_batch_size = 2
#   max_batch_timeout = 5
#   max_retries = 3
#   dead_letter_queue = "fakan-audit-dlq"
#
#   [triggers]
#   crons = ["*/15 * * * *"]
#
# Současně odebereme z `fakan` Workeru, ať nevznikne race condition
# (dvě instance dispatcheru = duplicitní maily).
[[queues.producers]]
binding = "AUDIT_QUEUE"
queue = "fakan-audit-jobs"

